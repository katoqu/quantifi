# This is an example configuration file
# To learn more, see the full config.yaml reference: https://docs.continue.dev/reference
name: Quantify Config
version: 1.0.0
schema: v1

# Define which models can be used
# https://docs.continue.dev/customization/models
models:
  - name: my gpt-5
    provider: openai
    model: gpt-5
    apiKey: YOUR_OPENAI_API_KEY_HERE
  - name: qwen2.5-coder 7b
    provider: ollama
    model: qwen2.5-coder:7b
    roles:
      - apply
      - autocomplete
      - chat
      - edit
  - name: Claude 4 Sonnet
    provider: anthropic
    model: claude-sonnet-4-20250514
    apiKey: ${{ secrets.ANTHROPIC_API_KEY }}
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 200000
      maxTokens: 64000
    capabilities:
      - tool_use
      - image_input

  - name: Codestral (Fast Autocomplete)
    provider: mistral
    model: codestral-latest
    apiKey: "Vn5MYask6u55Nz0lBTDuCk4Yp5Uh2sdN"
    roles:
      - autocomplete

  - name: Mistral Small (Caveman Chat)
    provider: mistral
    model: mistral-small-latest
    apiKey: "Vn5MYask6u55Nz0lBTDuCk4Yp5Uh2sdN"
    systemPrompt: "Adopt full Caveman Mode. Strip all greetings, filler, introductions, and meta-commentary. Code blocks must be byte-for-byte exact. Speak only in sparse technical fragments."
    roles:
      - chat
      - edit
