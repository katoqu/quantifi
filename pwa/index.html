<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Quantifi PWA</title>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <h1>Quantifi</h1>
          <p>Local-first metric tracker</p>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button id="themeToggle" class="secondary" style="padding: 6px 12px; min-height: 36px; border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem;" aria-label="Toggle Theme">🌓 Theme</button>
          <button id="installButton" class="secondary hidden">Install PWA</button>
        </div>
      </header>

      <nav class="tabs" aria-label="Primary navigation">
        <button class="tab active" data-view="home">Home</button>
        <button class="tab" data-view="add">Add</button>
        <button class="tab" data-view="log">Log</button>
        <button class="tab" data-view="stats">Stats</button>
        <button class="tab" data-view="settings">Settings</button>
      </nav>

      <div id="backupReminderBanner" class="info-banner warning hidden" style="margin: 0 0 10px 0; cursor: pointer; text-align: center;">
        ⚠️ You have added <strong id="unsavedCount">0</strong> new entries since your last backup.<br><strong>Tap here to download a quick CSV backup</strong> to secure your data.
      </div>

      <main>
        <section id="view-home" class="view active">
          <div id="homeCategoryPills" class="pills-container"></div>
          <div class="panel">
            <div id="metricGrid" class="metric-grid"></div>
          </div>
        </section>

        <section id="view-add" class="view">
          <button class="back-button secondary">← Back</button>
          <div id="addCategoryPills" class="pills-container"></div>
          <div class="panel">
            <form id="entryForm" class="stacked-form">
              <label>
                Metric
                <select id="metricSelect"></select>
              </label>
              <label>
                Date
                <div id="entryDatePills" class="pills-container"></div>
                <div id="dateTimeFields" class="hidden">
                  <div class="strength-grid">
                    <label>
                      Date
                      <input type="date" id="entryDate" required />
                    </label>
                    <label>
                      Time
                      <input type="time" id="entryTime" required />
                    </label>
                  </div>
                </div>
              </label>
              <div id="numericValueField">
                <label>
                  Value
                  <input type="number" id="entryValue" step="any" required />
                </label>
              </div>
              <div id="strengthWorkoutFields" class="hidden">
                <div id="strengthBaseline" class="info-banner hidden"></div>
                <div class="strength-grid">
                  <label>
                    Load (kg)
                    <input type="number" id="strengthLoadInput" step="0.5" min="0" required />
                  </label>
                  <label>
                    Reps
                    <input type="number" id="strengthRepsInput" step="1" min="1" value="5" required />
                  </label>
                </div>
                <button id="strengthAddSetButton" type="button" class="secondary">Add set</button>
                <div id="strengthSetList" class="list"></div>
              </div>
              <div id="targetActionField">
                <label>
                  Target for next session
                  <div id="targetActionPills" class="pills-container"></div>
                </label>
              </div>
              <button type="submit" class="primary">Save entry</button>
            </form>
          </div>
        </section>

        <section id="view-stats" class="view">
          <button class="back-button secondary">← Back</button>
          <div id="statsCategoryPills" class="pills-container"></div>
          <div class="panel">
            <h2>Stats</h2>
            
            <div class="stacked-form" style="margin-bottom: 15px;">
              <label>
                Select Metric
                <select id="statsMetricSelect"></select>
              </label>

              <div id="statsControls" class="viz-controls hidden" style="margin-top: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                  <div class="segmented-control" id="statsPeriodControl" style="display: flex; background: var(--secondary-background-color, #1e293b); border-radius: 8px; padding: 2px;">
                    <button type="button" class="segment active" data-period="Month" style="background: var(--primary, #3b82f6); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500;">Month</button>
                    <button type="button" class="segment" data-period="Week" style="background: transparent; color: var(--text-color, #f8fafc); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500;">Week</button>
                    <button type="button" class="segment" data-period="6M" style="background: transparent; color: var(--text-color, #f8fafc); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500;">6M</button>
                    <button type="button" class="segment" data-period="Year" style="background: transparent; color: var(--text-color, #f8fafc); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500;">Year</button>
                    <button type="button" class="segment" data-period="All" style="background: transparent; color: var(--text-color, #f8fafc); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500;">All</button>
                  </div>
                  <label class="checkbox-label" style="display: flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer;">
                    <input type="checkbox" id="statsZerosToggle" /> Zeros
                  </label>
                </div>

                <div id="statsStrengthControl" class="hidden" style="margin-top: 12px;">
                  <label>
                    Strength Aggregate
                    <select id="statsStrengthSelect">
                      <option value="Total Volume">Total Volume</option>
                      <option value="Max Load">Max Load</option>
                      <option value="Average Load">Average Load</option>
                      <option value="Max e1RM">Max e1RM</option>
                    </select>
                  </label>
                </div>
              </div>
            </div>

            <div id="statsChartContainer" class="chart-container hidden" style="margin: 20px 0; min-height: 200px;"></div>
            <div id="statsSummary" class="stats-summary"></div>
          </div>
        </section>

        <section id="view-log" class="view">
          <button class="back-button secondary">← Back</button>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <div id="logCategoryPills" class="pills-container" style="margin: 0; flex: 1;"></div>
            <label class="checkbox-label" style="display: flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; margin-left: 10px;">
              <input type="checkbox" id="logShowArchived" /> Archived
            </label>
          </div>

          <div class="panel">
            <h2>New change</h2>
            <form id="changeForm" class="stacked-form">
              <label>
                Category
                <select id="changeCategory"></select>
              </label>
              <label>
                Title
                <input type="text" id="changeTitle" required />
              </label>
              <label>
                Notes (Markdown supported)
                <textarea id="changeNotes" rows="4" placeholder="Optional context, routine details, exceptions..."></textarea>
              </label>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <label>
                  Date
                  <input type="date" id="changeDate" required />
                </label>
                <label>
                  Time
                  <input type="time" id="changeTime" required />
                </label>
              </div>
              <button type="submit" class="primary">Add Change</button>
            </form>
          </div>

          <div class="panel">
            <h2>Routines</h2>
            <div id="changeList" class="list"></div>
          </div>
        </section>


        <section id="view-settings" class="view">
          <button class="back-button secondary">← Back</button>
          <div class="panel">
            <h2>Categories</h2>
            <form id="categoryForm" class="stacked-form inline-form">
              <input type="text" id="categoryName" placeholder="New category" required />
              <button type="submit" class="primary">Add category</button>
            </form>
            <div id="categoryList" class="list"></div>
          </div>

          <div class="panel">
            <h2>Metrics</h2>
            <form id="metricForm" class="stacked-form">
              <label>
                Name
                <input type="text" id="metricName" required />
              </label>
              <label>
                Category
                <select id="metricCategory"></select>
              </label>
              <label>
                Unit
                <input type="text" id="metricUnit" placeholder="kg, steps, score" />
              </label>
              <label>
                Type
                <select id="metricType">
                  <option value="float">float</option>
                  <option value="integer">integer</option>
                  <option value="integer_range">integer_range</option>
                </select>
              </label>
              <label>
                Kind
                <select id="metricKind">
                  <option value="quantitative">quantitative</option>
                  <option value="count">count</option>
                  <option value="score">score</option>
                  <option value="strength_session">strength_session</option>
                </select>
              </label>
              <button type="submit" class="primary">Add metric</button>
            </form>
            <div id="metricList" class="list"></div>
          </div>

          <div class="panel">
            <h2>Backup</h2>
            <div class="backup-actions">
              <button id="exportButton" class="secondary" type="button">Export CSV</button>
              <button id="importButton" class="secondary" type="button">Import CSV</button>
              <input id="importFile" type="file" accept=".csv" hidden />
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
